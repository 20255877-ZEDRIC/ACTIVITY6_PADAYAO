<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
         body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
         header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
           
        }
         .brand-name {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
          nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: #d4af37; /* Gold hover effect */
        }
         main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
         .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        /* Formatted Circular Images */
        .image-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%; /* Makes image perfectly rounded */
            border: 4px solid #d4af37; /* Gold border */
            object-fit: cover;
        }

        /* Typography */
        .card h1 {
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        /* Call-To-Action Button */
        .cta-btn {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 2px solid #1a1a1a;
            padding: 12px 28px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background-color: #d4af37;
            border-color: #d4af37;
            color: #ffffff;
        }

        /* Footer */
        footer {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 15px 10px;
            font-size: 0.85rem;
        }
.about-section {
    min-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f8;
    padding: 60px 20px;
}

.about-card {
    background: white;
    width: 600px;
    max-width: 90%;
    padding: 45px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

.about-pfp {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #dcae27;
    margin-bottom: 20px;
}

.about-card h2 {
    font-size: 30px;
    margin-bottom: 18px;
    color: #181818;
    letter-spacing: 2px;
}

.about-card p {
    font-size: 16px;
    line-height: 1.7;
    color: #666;
    margin: 0 auto;
}
    </style>
</head>
<body>
     <header>
        <div class="brand-name">Ian's Creatives</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="ABOUT_SECTION.html">ABOUT</a>
            <a href="GALERRY_SECTION.html">GALLERY</a>
            <a href="#contact">CONTACT</a>
        </nav>
    </header>
    <main>
        <section class="about-section" id="about">
    <div class="about-card">

        <img src="pfp-1.png" alt="Profile Picture" class="about-pfp">

        <h2>ABOUT</h2>

        <p>
            I’m a creative designer passionate about web design, digital graphics,
            and UI/UX. I enjoy creating clean, modern, and user-friendly designs
            that turn ideas into meaningful visual experiences.
        </p>

    </div>
</section>
    </main>
     <footer>
        &copy; 2026 Padayao Zedric Creatives Creatives
    </footer>
</body>
</html>
